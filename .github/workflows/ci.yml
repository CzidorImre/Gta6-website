name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  database-and-e2e:
    name: Database tests, end-to-end tests, Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Start local Supabase (Postgres, Auth, REST, Mailpit)
        run: pnpm exec supabase start -x studio,postgres-meta,imgproxy,storage-api,edge-runtime,logflare,vector,supavisor,realtime

      - name: Database tests (pgTAP)
        run: pnpm exec supabase test db

      - name: Check generated types are up to date
        run: |
          pnpm db:types
          git diff --exit-code -- src/lib/supabase/database.types.ts

      - name: Write .env.local for the local stack
        run: pnpm env:local

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests (Playwright)
        run: pnpm test:e2e
        env:
          CI: 'true'

      - name: Lighthouse (mobile, performance and accessibility ≥ 90)
        run: |
          pnpm start -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/en > /dev/null && break; sleep 1; done
          CHROME_PATH="$(which google-chrome || which chromium)" pnpm lighthouse

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          if-no-files-found: ignore
          retention-days: 7
